<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Startpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
      <img src="image/logo.png" alt="logo">
      <h2 class="logo">SALMOTIDE</h2>

      <div class="widgets">
        <div class="widget-card">
          <span>Weather</span>
          <strong id="weather-temp">--°C</strong>
          <small id="weather-status">Detecting location...</small>
        </div>

        <div class="widget-card">
          <span>Currency</span>
          <strong id="currency-rate">$1 = -- IDR</strong>
          <small>USD to IDR</small>
        </div>
      </div>

      <div class="clock-widget">
        <p id="date">June 29, 2009</p>
        <h1 id="clock">00:00:00</h1>
      </div>

    </header>
    <main class="hero">
      <form action="https://www.google.com/search" method="get">
        <input type="text" name="q" placeholder="Search the ocean..." autofocus>
      </form>
      <ul class="shortcuts">
        <li>
          <a href="https://www.youtube.com">
            <img src="image/yt.png" alt="Youtube icon">
            <span>Youtube</span>
          </a>
        </li>
        
        <li>
          <a href="https://github.com/salmotide">
            <img src="image/git.png" alt="github icon">
            <span>GitSalmo</span>
          </a>
        </li>

        <li>
          <a href="https://web.whatsapp.com/">
            <img src="image/wa.png" alt="WhatsApp icon">
            <span>WhatsApp</span>
          </a>
        </li>

        <li>
          <a href="https://chatgpt.com">
            <img src="image/gpt.png" alt="chatgpt icon">
            <span>ChatGPT</span>
          </a>
        </li>
      </ul>
    </main>
  <script src="script.js"></script>
</body>
</html>
